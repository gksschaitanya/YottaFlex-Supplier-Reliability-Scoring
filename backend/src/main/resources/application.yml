spring:
  application:
    name: supplier-reliability-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:yottaflex_phase4_test}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: ${GENERATION_BATCH_SIZE:500}
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: public
    schemas: public
    clean-disabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
      cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
        allowed-methods: GET,OPTIONS
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

platform:
  generation:
    seed: ${GENERATION_SEED:20261022}
    reference-date: ${GENERATION_REFERENCE_DATE:2026-10-22}
    generator-version: ${GENERATOR_VERSION:1.0.0}
    default-scale: ${GENERATION_SCALE:STARTER}
    batch-size: ${GENERATION_BATCH_SIZE:500}
    enabled: ${GENERATION_ENABLED:true}
    maximum-batch-size: ${GENERATION_MAXIMUM_BATCH_SIZE:2000}
    starter:
      suppliers: ${GENERATION_STARTER_SUPPLIERS:25}
      purchase-orders: ${GENERATION_STARTER_PURCHASE_ORDERS:120}
      shipments: ${GENERATION_STARTER_SHIPMENTS:180}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
